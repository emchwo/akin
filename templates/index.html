<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ app_name }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%232E2A25' stroke-width='5' stroke-linecap='round'%3E%3Ccircle cx='28' cy='38' r='15'/%3E%3Cpath d='M43 23 V53'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <span class="wordmark">{% include "_logo.html" %}</span>
    <div class="progress" id="progress" aria-label="Game progress"></div>
  </header>

  <main id="stage" class="stage" aria-live="polite"></main>

  <button class="stats-toggle" id="stats-toggle" aria-expanded="false" aria-controls="stats-panel">Stats</button>
  <aside class="stats-panel" id="stats-panel" hidden>
    <div class="stats-head">
      <span class="eyebrow">This game · {{ model }}</span>
      <button class="stats-close" id="stats-close" aria-label="Close stats">×</button>
    </div>
    <div id="stats-body"><p class="stats-empty">Start a game to see token use.</p></div>
  </aside>

  <script src="{{ url_for('static', filename='icons.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
